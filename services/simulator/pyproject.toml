[project]
name = "simulator"
version = "0.2.0"
description = "Telemetry simulator for the AI Predictive Maintenance platform"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyarrow>=18.0",
]

# The MQTT transport is an extra rather than a core dependency, for the same
# structural reason `ml` makes torch one: `ml` depends on `simulator`, and
# `services/inference` depends on `ml[train]`, so a core MQTT client would ride
# into the inference image and into every CI job to serve a `--sink mqtt` that
# most of them never select.
#
# It also has to be importable *lazily*. `simulator.infrastructure.sinks`
# re-exports every sink and `simulator.cli` imports that package, so a
# module-level `import paho` would make the CLI unimportable — and `test_cli.py`
# imports it — in the default offline tier, where the extra is not installed.
[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1"]

# The HTTP surface that lets the API start and stop a run. An extra for exactly
# the reason `mqtt` is one, which is spelled out above and applies verbatim: as
# a core dependency, FastAPI would ride into `ml`, and from there into the
# inference and training images, to serve a control surface neither of them has.
#
# Like paho, it must be imported lazily. `simulator.cli` is imported by tests in
# the default offline tier, where no extras are installed.
control = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]
