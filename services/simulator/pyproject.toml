[project]
name = "simulator"
version = "0.2.0"
description = "Telemetry simulator for the AI Predictive Maintenance platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyarrow>=18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]
