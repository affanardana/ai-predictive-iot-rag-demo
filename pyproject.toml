[project]
name = "ai-predictive-maintenance"
version = "0.2.0"
description = "AI Predictive Maintenance & Maintenance Copilot for industrial electric motors"
readme = "README.md"
# `>=3.12,<3.14`, not `<3.13`. The code runs on 3.13 -- the Phase 4 training
# run was on Colab, which ships 3.13.15 -- but the pin excluded it, so `pip
# install` refused to build the workspace there before reading a line of code.
# CI still runs 3.12, so the drift was invisible from here.
requires-python = ">=3.12,<3.14"
dependencies = []

# The workspace root is a virtual project: it is not built or published, it
# only anchors the workspace and holds shared tool configuration.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "services/simulator", "services/inference", "ml"]

# Dev tooling is shared across every workspace member.
[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "import-linter>=2.1",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "modal>=1.5.5",
]

# ===========================================================================
# ruff
# ===========================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "apps/api/src",
    "apps/api/tests",
    "services/simulator/src",
    "services/inference/src",
    "ml/src",
]
# `ml/notebooks` is excluded because ruff lints `.ipynb` files by default
# (0.6.0 onwards), and the Colab notebook is orchestration rather than code.
# Its thinness is enforced by a test that parses the notebook JSON, which is a
# stricter check than a linter would give it.
extend-exclude = ["migrations/versions", "ml/notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "D",   # pydocstyle
    "S",   # flake8-bandit
    "RUF", # ruff-specific
]
ignore = [
    "D203", # conflicts with D211 (blank line before class docstring)
    "D213", # conflicts with D212 (multi-line summary position)
    "D107", # docstring on __init__: the coding standards require class
            # docstrings, not constructor docstrings, and a docstring that
            # restates three assignments adds noise rather than clarity.
]

[tool.ruff.lint.per-file-ignores]
# S105/S106 flag hardcoded credentials. A test that needs to prove a shared
# secret is checked has to name one, and a literal in a test file is not a
# secret -- the real value comes from the environment and never reaches here.
"**/tests/**" = ["S101", "S105", "S106", "ANN001", "ANN201", "ANN202", "D102", "D103"]
"**/migrations/**" = ["D", "ANN", "E501", "S105"]
# S311 warns that a pseudo-random generator is unsuitable for cryptographic use.
# In the simulator there is nothing to protect and reproducibility is the
# requirement (`MASTERPLAN.md` §3.5): the output must be identical for a given
# seed on every machine and every run. A CSPRNG would be the wrong tool, since
# its output depends on OS entropy and could not be regenerated.
#
# `ml` composes the fleet's timelines, so it draws from the same generators for
# the same reason — a life's length and scenario have to be regenerable from the
# plan, and nothing here is a secret.
"services/simulator/**" = ["S311"]
"ml/**" = ["S311"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["api", "inference", "ml", "simulator"]

# ===========================================================================
# mypy
# ===========================================================================
[tool.mypy]
python_version = "3.12"
mypy_path = ["apps/api/src", "services/simulator/src", "services/inference/src", "ml/src"]
# Every workspace member must be listed. `uv run mypy` with no arguments uses
# `files`, so a member missing from here is never type-checked and CI still
# passes — a silent gap rather than a failing build.
files = [
    "apps/api/src",
    "apps/api/tests",
    "services/simulator/src",
    "services/inference/src",
    "ml/src",
]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# Tests are allowed to be less pedantic than production code, but they are
# still type-checked so hand-written fakes are validated against the real
# repository Protocols.
[[tool.mypy.overrides]]
module = ["tests.*", "simulator.tests.*", "inference.tests.*", "ml.tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# pyarrow ships neither type stubs nor a `py.typed` marker, so mypy cannot
# analyse it. This is the available option short of adding a stub package as a
# dependency; the Parquet sinks are covered by round-trip tests instead, which
# check behaviour rather than annotations.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# torch is an optional extra, so it is absent from the default environment
# entirely. Without this override `uv run mypy` fails with "cannot find
# implementation or library stub" in exactly the environment the rest of the
# package is meant to be checked in. Same reasoning as pyarrow above, with the
# added twist that the module is legitimately not installed.
[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

# Same again for paho. The simulator's MQTT transport is an optional extra and
# CI does not install it, so `uv run mypy` has to pass without it.
[[tool.mypy.overrides]]
module = ["paho", "paho.*"]
ignore_missing_imports = true

# ===========================================================================
# pytest
# ===========================================================================
[tool.pytest.ini_options]
# Both services must be listed. `uv run pytest` uses `testpaths`, so a member
# missing from here has its tests silently not collected — CI reports green
# having run nothing.
#
# The simulator's tests live inside its package rather than in a sibling
# `tests/` directory. Two directories both named `tests` would produce two
# modules named `tests.conftest`, which pytest's default import mode rejects as
# an import-file mismatch. `simulator.tests.*` cannot collide with anything.
testpaths = [
    "apps/api/tests",
    "services/simulator/src/simulator/tests",
    "services/inference/src/inference/tests",
    "ml/src/ml/tests",
]
pythonpath = ["apps/api/src", "services/simulator/src", "services/inference/src", "ml/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The default run is offline and torch-free: `postgres`-, `torch`- and
# `mqtt`-marked tests deselect unless the caller asks for them explicitly (a
# later `-m` wins over this one).
#
# `torch` has to be named here and not merely declared in `markers`. A marker
# alone only lets a test be *selected*; with `-m 'not postgres'` still in force,
# the torch tests would be collected and run in the default offline job, where
# torch is not installed, and would fail rather than deselect. `mqtt` has the
# same problem for the same reason: its tests need a broker and the simulator's
# `mqtt` extra, neither of which the offline job has.
addopts = "-m 'not postgres and not torch and not mqtt' --strict-markers --strict-config"
markers = [
    "postgres: requires a live PostgreSQL database; set TEST_DATABASE_URL to run",
    "torch: requires the training extra (`uv sync --all-packages --all-extras`)",
    "mqtt: requires a live broker; set MQTT_BROKER_URL and install the `mqtt` extra",
]
log_cli_level = "WARNING"

# ===========================================================================
# import-linter
#
# This is where the architecture stops being a convention and becomes a gate.
# ===========================================================================
[tool.importlinter]
root_packages = ["api", "inference", "ml", "simulator"]
# Required so the forbidden contracts below can name third-party packages.
include_external_packages = true

# --- Layer direction -------------------------------------------------------
# Higher layers may import lower ones; never the reverse.
#   main         -> entrypoint, wires everything together
#   presentation -> HTTP only; may see the composition root, never infra
#   composition  -> the sole place that knows concrete adapters
#   application | infrastructure -> siblings, both depend only on domain
#   domain       -> depends on nothing
[[tool.importlinter.contracts]]
name = "Layer dependency direction"
type = "layers"
layers = [
    "api.main",
    "api.presentation",
    "api.composition",
    "api.infrastructure | api.application",
    "api.domain",
    # A shared kernel, sitting below even the domain. The request identifier is
    # written by presentation middleware and read by infrastructure's log
    # formatter, so neither layer may own it and neither may import the other.
    # Placed lowest, it can import nothing from `api` while staying importable
    # by everything above it.
    "api.request_context",
]

# --- Domain purity ---------------------------------------------------------
# CODING_STANDARDS.md: the Domain layer must never import a framework.
[[tool.importlinter.contracts]]
name = "Domain is framework-free"
type = "forbidden"
source_modules = ["api.domain"]
forbidden_modules = [
    "alembic",
    "fastapi",
    "httpx",
    "numpy",
    "pandas",
    "psycopg",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "torch",
    "uvicorn",
]

# --- Application purity ----------------------------------------------------
# Application orchestrates through domain ports. It must not reach for a
# database driver, a web framework, or configuration plumbing.
[[tool.importlinter.contracts]]
name = "Application depends only on domain"
type = "forbidden"
source_modules = ["api.application"]
forbidden_modules = [
    "api.infrastructure",
    "api.presentation",
    "alembic",
    "fastapi",
    "psycopg",
    "pydantic_settings",
    "sqlalchemy",
]

# --- Presentation must not touch persistence -------------------------------
# Indirect imports are permitted, so presentation can receive the wired
# container from the composition root. That indirection is the entire point of
# having a composition root, and forbidding it would put this contract in direct
# conflict with the layers contract above. What remains forbidden is
# presentation reaching an adapter *directly* -- the coupling that actually
# hurts, and the one that would make the HTTP layer untestable without a
# database.
[[tool.importlinter.contracts]]
name = "Presentation does not import infrastructure"
type = "forbidden"
source_modules = ["api.presentation"]
forbidden_modules = [
    "api.infrastructure",
    "alembic",
    "psycopg",
    "sqlalchemy",
]
allow_indirect_imports = true

# --- Simulator layering ----------------------------------------------------
#   cli             -> the composition point; the only module naming a sink
#   infrastructure | application -> siblings; both depend only on the domain
#   domain          -> the simulation model, depending on nothing
[[tool.importlinter.contracts]]
name = "Simulator layer dependency direction"
type = "layers"
layers = [
    "simulator.cli",
    "simulator.infrastructure | simulator.application",
    "simulator.domain",
]

# The simulation model must stay pure. `random` and `math` are standard library
# and allowed; a plotting library, a dataframe library, or a sink creeping in
# would make the model depend on where its output happens to go.
# --- `ml` is a separate deployable -----------------------------------------
# `ml` runs on Colab or Modal, not beside the API. Dragging FastAPI, SQLAlchemy
# and psycopg into a training environment to compute a column mean would be
# absurd, and an accidental import is exactly how it happens — a convenience
# helper reused once, and the training image silently grows a web stack.
[[tool.importlinter.contracts]]
name = "The ML package does not depend on the API"
type = "forbidden"
source_modules = ["ml"]
forbidden_modules = [
    "api",
    "alembic",
    "fastapi",
    "psycopg",
    "pydantic_settings",
    "sqlalchemy",
    "uvicorn",
]

# The rules that decide what a training row *is* — which columns are features,
# where a life begins and ends, and which label a timestep carries — are pure
# decisions about the problem. Keeping them free of numpy and pyarrow means they
# can be read, reasoned about, and tested without a data stack in the room, and
# that a missing `uv sync` cannot make the important half of the package
# unimportable.
[[tool.importlinter.contracts]]
name = "The labelling core is dependency-free"
type = "forbidden"
source_modules = [
    "ml.dataset.errors",
    "ml.dataset.features",
    "ml.dataset.labelling",
    "ml.dataset.lives",
    "ml.dataset.plan",
    "ml.dataset.splits",
    "ml.dataset.windows",
]
forbidden_modules = ["numpy", "pyarrow"]

# The contract that makes Phase 4 verifiable at all. Training runs on a GPU
# somewhere else, so the rule is that everything deciding whether a published
# number is trustworthy — the window index and its labels, the sampler's draw,
# the run config, the manifest, and the stored predictions — must run without
# torch installed. What is left in `ml.model` is a thin adapter over arrays that
# were built and tested elsewhere.
#
# Enforced rather than intended, because the failure is silent and pleasant: an
# import added for convenience makes the evaluation half quietly unusable on the
# machine that is supposed to reproduce it.
[[tool.importlinter.contracts]]
name = "The evaluation and experiment cores do not depend on torch"
type = "forbidden"
source_modules = ["ml.evaluation", "ml.experiment"]
forbidden_modules = ["ml.model", "torch"]

# Phase 3 has to keep working in an environment that has never heard of
# Phase 4 — `ml dataset report` is the command that states the dataset's own
# difficulty, and it must not acquire a dependency on a model it does not have.
[[tool.importlinter.contracts]]
name = "The dataset package does not depend on the model"
type = "forbidden"
source_modules = ["ml.dataset"]
forbidden_modules = [
    "ml.evaluation",
    "ml.experiment",
    "ml.model",
    "torch",
]

# `services/inference` is a deployable of its own, running in a different
# container from the API. The API calls it over HTTP and owns the domain rules;
# an import added here for convenience would silently make one deployment depend
# on the other's, which is exactly the coupling the split exists to prevent.
[[tool.importlinter.contracts]]
name = "The inference service does not depend on the API"
type = "forbidden"
source_modules = ["inference"]
forbidden_modules = [
    "api",
    "alembic",
    "psycopg",
    "pydantic_settings",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "Simulator domain is self-contained"
type = "forbidden"
source_modules = ["simulator.domain"]
forbidden_modules = [
    "paho",
    "pyarrow",
    "simulator.application",
    "simulator.cli",
    "simulator.infrastructure",
]
