name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types, architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-packages

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      # Enforces the layer contracts declared in the root pyproject.toml.
      # The same rules are asserted in tests/unit/architecture, so they fail
      # the ordinary test run as well as this step.
      - name: Check architecture contracts
        run: uv run lint-imports

  # The frontend compiles against types generated from the API's OpenAPI
  # document, which is itself generated from the API's code. Without this job
  # the chain has no gate: a schema change would land, the generated types
  # would silently keep describing the old shape, and the mismatch would
  # surface as an empty table in a browser rather than as a failing build.
  web:
    name: Web (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        working-directory: .
        run: uv sync --locked --all-packages

      # Exported from the application object, so this needs no server and no
      # database -- `Settings` is given a URL that is never dialled and the
      # engine it configures opens no connection until a query runs.
      #
      # `--out` rather than a shell redirect: `>` produces UTF-16 on Windows
      # PowerShell, which every JSON parser rejects. The script writes the bytes
      # itself so the shell cannot decide the encoding.
      - name: Export the OpenAPI document
        working-directory: .
        run: uv run python apps/api/scripts/export_openapi.py --out apps/web/openapi.json

      - name: Regenerate the API types
        run: npm run gen:api

      # Fails when the API's contract and the committed types have drifted
      # apart. This is what makes `schema.d.ts` checked in rather than built
      # on the fly: the diff is the error message.
      #
      # `--intent-to-add` first, because plain `git diff` ignores untracked
      # files -- so a deleted `schema.d.ts` would be regenerated here, compared
      # against nothing, and pass. The step would still be green while the
      # file it guards was missing from the repository.
      - name: Check for schema drift
        run: |
          git add --intent-to-add src/api/schema.d.ts
          git diff --exit-code -- src/api/schema.d.ts

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Last, because a Vite or Tailwind misconfiguration shows up here and
      # nowhere else -- including the Tailwind v4 trap where a v3-style
      # `@tailwind` preamble builds successfully and emits no styles.
      - name: Build
        run: npm run build

  test:
    name: Tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-packages

      # No database, no credentials, no network: the default tier runs on
      # in-memory SQLite, and `postgres`-marked tests deselect themselves.
      - name: Run tests
        run: uv run pytest

  postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: predictive_maintenance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/predictive_maintenance_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/predictive_maintenance_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-packages

      - name: Apply migrations
        run: uv run alembic -c apps/api/alembic.ini upgrade head

      # Fails when the models and the migrations have drifted apart. This is
      # what makes the separate persistence models safe: the duplication
      # between domain entities and ORM models is caught here rather than
      # discovered as a runtime error.
      - name: Check for model/migration drift
        run: uv run alembic -c apps/api/alembic.ini check

      # Exercises the paths SQLite cannot emulate: ON CONFLICT ... RETURNING,
      # CHECK constraints, timestamptz semantics, and the epoch bucketing SQL.
      - name: Run PostgreSQL tests
        run: uv run pytest -m postgres
