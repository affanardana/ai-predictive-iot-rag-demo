name: CI

# **Every job runs on demand. Nothing here runs automatically.**
#
# This workflow used to be the gate on every push to `main` and every pull
# request. It is now started by hand, from the Actions tab or:
#
#     gh workflow run CI
#
# **The consequence, stated rather than implied: nothing checks a push any
# more.** A regression can land on `main` and stay there until somebody runs
# this. The jobs below are cheap and they pass; running the workflow before a
# deploy, after touching `pyproject.toml` or `uv.lock`, or after changing a
# `Dockerfile`, is the habit that replaces the automation. Nothing enforces
# that habit -- which is the trade being made here, and worth knowing on the
# day a broken commit reaches `main`.
#
# The model-backed job at the bottom is where this started: it downloads a
# 940 MB GGUF and builds a torch image, so it never belonged in a per-push run.
# It was nightly for a while and could never pass -- `.dockerignore` excludes
# `**/tests/`, so the inference image contains no test files and `pytest`
# inside it had nothing to collect. A job that emails a failure every night
# without ever being right is worse than no job, because it teaches the habit
# of ignoring CI mail.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types, architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-packages

      # Validates `compose.yaml` and, through it, `env.template` -- that file
      # is copied to `.env` here so the interpolation is checked against real
      # values. Without the two required secrets, `${VAR:?}` fails and the step
      # proves nothing.
      #
      # It catches the class of error that only appears at deploy time: an
      # unknown variable, a typo in a service name, a YAML key that parses as
      # something else. Cheap, and it runs before any container does.
      - name: Validate the Compose file
        run: |
          cd infra/compose
          cp env.template .env
          DATABASE_URL='postgresql+psycopg://user:pass@host:5432/db'           INGEST_API_TOKEN='ci-not-a-secret'           N8N_ENCRYPTION_KEY='ci-not-a-secret'             docker compose config -q
          rm -f .env

      # The Definition of Done says secrets are not committed. `.gitignore`
      # covers the obvious ones, and a test in the API suite asserts that the
      # rules are still there -- this is for what rules cannot express, and for
      # anything that reached the history before a rule existed.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      # Enforces the layer contracts declared in the root pyproject.toml.
      # The same rules are asserted in tests/unit/architecture, so they fail
      # the ordinary test run as well as this step.
      - name: Check architecture contracts
        run: uv run lint-imports

  # The frontend compiles against types generated from the API's OpenAPI
  # document, which is itself generated from the API's code. Without this job
  # the chain has no gate: a schema change would land, the generated types
  # would silently keep describing the old shape, and the mismatch would
  # surface as an empty table in a browser rather than as a failing build.
  web:
    name: Web (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        working-directory: .
        run: uv sync --locked --all-packages

      # Exported from the application object, so this needs no server and no
      # database -- `Settings` is given a URL that is never dialled and the
      # engine it configures opens no connection until a query runs.
      #
      # `--out` rather than a shell redirect: `>` produces UTF-16 on Windows
      # PowerShell, which every JSON parser rejects. The script writes the bytes
      # itself so the shell cannot decide the encoding.
      - name: Export the OpenAPI document
        working-directory: .
        run: uv run python apps/api/scripts/export_openapi.py --out apps/web/openapi.json

      - name: Regenerate the API types
        run: npm run gen:api

      # Fails when the API's contract and the committed types have drifted
      # apart. This is what makes `schema.d.ts` checked in rather than built
      # on the fly: the diff is the error message.
      #
      # `--intent-to-add` first, because plain `git diff` ignores untracked
      # files -- so a deleted `schema.d.ts` would be regenerated here, compared
      # against nothing, and pass. The step would still be green while the
      # file it guards was missing from the repository.
      - name: Check for schema drift
        run: |
          git add --intent-to-add src/api/schema.d.ts
          git diff --exit-code -- src/api/schema.d.ts

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      # Last, because a Vite or Tailwind misconfiguration shows up here and
      # nowhere else -- including the Tailwind v4 trap where a v3-style
      # `@tailwind` preamble builds successfully and emits no styles.
      - name: Build
        run: npm run build

  test:
    name: Tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-packages

      # No database, no credentials, no network: the default tier runs on
      # in-memory SQLite, and `postgres`-marked tests deselect themselves.
      - name: Run tests
        run: uv run pytest

  postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        # The pgvector image, not plain `postgres:16`. Migration 0003 creates
        # the `vector` extension for the knowledge corpus, and the stock image
        # does not ship it -- so `alembic upgrade head` fails outright rather
        # than the failure looking like anything to do with retrieval.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: predictive_maintenance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/predictive_maintenance_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/predictive_maintenance_test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-packages

      - name: Apply migrations
        run: uv run alembic -c apps/api/alembic.ini upgrade head

      # Fails when the models and the migrations have drifted apart. This is
      # what makes the separate persistence models safe: the duplication
      # between domain entities and ORM models is caught here rather than
      # discovered as a runtime error.
      - name: Check for model/migration drift
        run: uv run alembic -c apps/api/alembic.ini check

      # Exercises the paths SQLite cannot emulate: ON CONFLICT ... RETURNING,
      # CHECK constraints, timestamptz semantics, and the epoch bucketing SQL.
      - name: Run PostgreSQL tests
        run: uv run pytest -m postgres

  # ---------------------------------------------------------------------------
  # The model-backed tier: the slow one, and where the manual trigger began.
  # ---------------------------------------------------------------------------
  # A 940 MB download and a torch image build, which is why this was never a
  # per-push job in the first place -- and, once it could not be trusted to
  # pass, part of why the rest of the workflow stopped being automatic too. See
  # the note on `on:` above.
  #
  # What it does that nothing else does is build `Dockerfile.inference` -- the
  # image that changes least and breaks worst, with torch, two sentence encoders
  # fetched from HuggingFace and a llama.cpp wheel pinned to an ABI. A build
  # failure there is a failed deploy, and this is the one place to find out
  # before the deploy does.
  #
  # **It does not currently run the `llm` tests, and says so rather than
  # pretending.** Those tests need the GGUF *and* the test files, and
  # `.dockerignore` excludes `**/tests/`, so the image has the model and not the
  # tests. Making it run them means bind-mounting the directory in the `docker
  # run` below, and the command for doing it by hand -- which is how they are
  # run -- is in that test file's own docstring. The behaviour itself is
  # covered live: the deployment runs this model on every question, and
  # `ml copilot evaluate` scores ten of them.
  #
  # Renamed from `nightly-model`, and its `if: github.event_name ==
  # 'workflow_dispatch'` went with the change that made the whole workflow
  # manual. The display `name` is what a reader sees in the Actions tab, but
  # the key is what a status check or a `gh run` filter would name, and a key
  # saying `nightly` about a job that cannot run nightly is the same lie in a
  # quieter place. The `if:` is gone because a condition every job satisfies is
  # a sentence that says nothing -- and it would read as though some other job
  # might still run on its own.
  inference-image:
    name: Inference image (on demand)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build the inference image
        run: docker build -f infra/compose/Dockerfile.inference -t pdm-inference:ci .

      - name: Fetch the Copilot's model
        run: |
          mkdir -p model/chat
          curl -fL --retry 3 -o model/chat/qwen2.5-1.5b-instruct-q4_k_m.gguf \
            https://huggingface.co/bartowski/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf

      # The check this job exists for: the GGUF loads inside the built image and
      # the model produces an answer. That is what a deploy depends on, and it
      # is the smallest command that proves it.
      #
      # **Not `pytest`, and the reason is the bug that retired the nightly
      # schedule.** `.dockerignore` excludes `**/tests/`, so the image contains
      # the model and no tests; the previous version of this step ran pytest
      # against a directory that was never there and failed every night for it.
      # A pytest invocation also needs config this image does not carry. This
      # needs neither.
      #
      # The `llm`-marked tests still exist and still run -- by hand, on the
      # host, by the command in the docstring of
      # `services/inference/src/inference/tests/test_chat_model.py`. Written
      # once, in the file it runs, so there is no second copy to drift. What is
      # covered continuously is the behaviour: the deployment runs this model on
      # every question, and `ml copilot evaluate` scores ten of them.
      - name: Load the model and make it answer
        run: |
          docker run --rm \
            -v "$PWD/model:/model:ro" \
            -e INFERENCE_CHAT_MODEL=/model/chat/qwen2.5-1.5b-instruct-q4_k_m.gguf \
            pdm-inference:ci python -c "
          import os
          from pathlib import Path

          from inference.chat import LlamaChat, Turn
          from inference.settings import Settings

          settings = Settings(
              checkpoint=Path('unused-by-this-check'),
              artifact_dir=Path('unused-by-this-check'),
              chat_model=Path(os.environ['INFERENCE_CHAT_MODEL']),
          )
          answer = ''.join(
              LlamaChat(settings).stream(
                  [Turn(role='user', content='Reply with the number 0.81 and nothing else.')],
                  max_tokens=24,
              )
          )
          print('the model said:', repr(answer.strip()))
          assert answer.strip(), 'the model produced nothing at all'
          "
