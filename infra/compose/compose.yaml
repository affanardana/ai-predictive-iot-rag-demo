# The self-hosted backend.
#
# Three services on one VPS. PostgreSQL stays on Supabase and the broker stays at
# `broker.emqx.io`, so neither is a container here -- which is most of why this
# fits on a single core.
#
# **There is no Caddy here, and that is deliberate.** This host already runs
# another project (`~/ifne`) whose Caddy owns 0.0.0.0:80 and 0.0.0.0:443 through
# `network_mode: host`. Two reverse proxies cannot share those ports, and the
# one that starts second fails with `address already in use` in a way that looks
# like a bug in whichever project lost. One proxy per host is the right
# architecture, so the API and n8n publish to loopback and that Caddy proxies to
# them. `README.md` has the two blocks to add to its Caddyfile.
#
# Bring it up from this directory:
#
#     cp env.template .env     # then fill it in
#     docker compose up -d --build
#
# `infra/compose/README.md` is the runbook, including the model artefacts that
# have to be copied to the host before the inference service will start.

name: pdm

services:
  # ---------------------------------------------------------------------------
  # The API.
  # ---------------------------------------------------------------------------
  api:
    build:
      # The context is the repository root, not this directory: the Dockerfile
      # copies `apps/api/...` and needs those paths to exist below it.
      context: ../..
      dockerfile: infra/compose/Dockerfile.api
    restart: unless-stopped
    # Deliberately NOT `env_file: .env`.
    #
    # `Settings` is declared with `extra="forbid"`, so an unknown variable is a
    # startup failure rather than a typo that quietly takes a default. The
    # server's `.env` also holds n8n's encryption key, the MQTT credentials and
    # the workflow's tokens -- passing all of that in would kill the container
    # with a validation error about a variable it has no business knowing.
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required -- see env.template}
      INGEST_API_TOKEN: ${INGEST_API_TOKEN:?INGEST_API_TOKEN is required}
      # The service name, never localhost. `Settings` defaults this to
      # `http://localhost:8001`, which inside this container is the API itself,
      # and the failure looks like a cold model rather than a config error.
      INFERENCE_SERVICE_URL: http://inference:8001
      # The service name, for the same reason and with the same trap: the
      # default is `http://localhost:8002`, which inside this container is the
      # API itself, and the failure reads as a simulator that never starts
      # rather than as a wrong address.
      SIMULATION_SERVICE_URL: http://simulator:8002
      # One run per machine is enforced by the schema; this is the fleet-wide
      # ceiling on top of it. A run costs CPU on a box that shares one core.
      SIMULATION_MAX_CONCURRENT_RUNS: ${SIMULATION_MAX_CONCURRENT_RUNS:-3}
      RISK_WARNING_THRESHOLD: ${RISK_WARNING_THRESHOLD:-0.30}
      RISK_HIGH_THRESHOLD: ${RISK_HIGH_THRESHOLD:-0.60}
      RISK_CRITICAL_THRESHOLD: ${RISK_CRITICAL_THRESHOLD:-0.80}
    ports:
      # Loopback only. This is not a public exposure -- it exists so the shared
      # Caddy on the host network can reach the container by port, which is how
      # it reaches every other service on this box.
      #
      # 8100, not 8000: that port belongs to the other project's API.
      - "127.0.0.1:8100:8000"
    healthcheck:
      # Readiness, not liveness. The engine is lazy, so the API starts happily
      # while Supabase is still unreachable -- this is what stops n8n from
      # calling it before it can actually answer.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              ok = urllib.request.urlopen(
                  "http://127.0.0.1:8000/health/ready", timeout=5
              ).status == 200
          except Exception:
              ok = False
          sys.exit(0 if ok else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      # The API reaches a database on another provider over the internet, so a
      # slow first check is expected rather than a fault.
      start_period: 30s

  # ---------------------------------------------------------------------------
  # The model service.
  # ---------------------------------------------------------------------------
  inference:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.inference
    restart: unless-stopped
    volumes:
      # Two files the image cannot contain: `best.pt` and
      # `artifact/normalization.json` are gitignored, so a build from a clone
      # has no way to include them -- and they change whenever the model is
      # retrained, which should not require rebuilding an image.
      #
      # Read-only. This service scores windows and writes nothing.
      - ${MODEL_DIR:-./model}:/model:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              ok = urllib.request.urlopen(
                  "http://127.0.0.1:8001/health", timeout=5
              ).status == 200
          except Exception:
              ok = False
          sys.exit(0 if ok else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      # Importing torch and loading the checkpoint takes a while on one core,
      # and the service refuses to open its port until the scorer exists. The
      # Modal deployment needed `startup_timeout=300` for the same reason.
      start_period: 180s

  # ---------------------------------------------------------------------------
  # The simulator.
  # ---------------------------------------------------------------------------
  # Idle until the API tells it to start. This is what satisfies AC-010: before
  # this service existed the demonstration required a simulator running on a
  # developer's laptop, and both runbooks said so.
  simulator:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.simulator
    restart: unless-stopped
    environment:
      # Read by `infrastructure.broker`, which is where the defaults and the
      # reasoning behind the topic prefix live. Publishing to any prefix other
      # than the one n8n subscribes to is accepted by the broker and silently
      # ignored by the orchestrator, so these two must agree.
      MQTT_HOST: ${MQTT_HOST:-broker.emqx.io}
      MQTT_PORT: ${MQTT_PORT:-8883}
      MQTT_TLS: ${MQTT_TLS:-true}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-pdm/demo}
      # Wall-clock seconds between readings. One second replays four hours of
      # degradation in four minutes, which is what the runbook demonstrates.
      SIMULATOR_TICK_SECONDS: ${SIMULATOR_TICK_SECONDS:-1.0}
      # Where to report run state. The service name, not a public hostname --
      # same reasoning as n8n's `PDM_API_BASE_URL`, and the same two variables
      # under the same names, set from one secret so they cannot drift.
      PDM_API_BASE_URL: http://api:8000
      PDM_INGEST_TOKEN: ${INGEST_API_TOKEN:?INGEST_API_TOKEN is required}
    # Deliberately no `ports:`. The control surface is unauthenticated, so
    # publishing it would put an open "start a run" endpoint on the internet.
    # `tests/unit/infrastructure/test_deployment_shape.py`-style checks on the
    # compose file fail if one is ever added.
    #
    # The limits matter on a one-core box shared with n8n, the API and torch.
    # They are estimates rather than measurements -- a run is I/O bound and
    # spends nearly all its wall clock asleep -- and should be tuned from
    # `docker stats` during a real run. What actually protects the box is the
    # API's cap on concurrent runs, enforced before this service is asked.
    cpus: "0.5"
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      # Liveness, not readiness. An idle simulator is a healthy simulator -- that
      # is the entire point of the service -- so this must not check for a run.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              ok = urllib.request.urlopen(
                  "http://127.0.0.1:8002/runs", timeout=5
              ).status == 200
          except Exception:
              ok = False
          sys.exit(0 if ok else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # One-shot: give n8n's volume to the user that runs n8n.
  # ---------------------------------------------------------------------------
  # Docker creates a named volume owned by `root`, and the n8n image drops to
  # user `node` (uid 1000) before it starts. So on a fresh volume n8n cannot
  # create `/data/.n8n` and crash-loops with:
  #
  #     Error: EACCES: permission denied, mkdir '/data/.n8n'
  #
  # This runs the image as root once, hands the directory over, and exits. It is
  # a service rather than a line in the runbook because a manual `chown` is
  # exactly the kind of step that gets missed -- and its failure mode is a crash
  # loop whose cause is four lines into a stack trace.
  #
  # Cheap and idempotent: a `chown` on a directory holding one SQLite file, run
  # on every `up`. It costs nothing worth optimising.
  n8n-permissions:
    image: docker.io/n8nio/n8n:1.115.3
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - n8n-data:/data
    restart: "no"

  # ---------------------------------------------------------------------------
  # n8n, the orchestrator.
  # ---------------------------------------------------------------------------
  n8n:
    # Pinned, and worth keeping pinned. Changing this tag changes the Node
    # version, the node library and the editor simultaneously, with no diff to
    # review.
    image: docker.io/n8nio/n8n:1.115.3
    restart: unless-stopped
    depends_on:
      n8n-permissions:
        condition: service_completed_successfully
    # No image build, no entrypoint overrides, no Python installed. Every one of
    # those existed in `infra/n8n/modal_app.py` only because a Modal function is
    # Python code that had to shell out to a Node application. A container runs
    # the official image's own entrypoint, so all of it goes.
    environment:
      N8N_USER_FOLDER: /data
      N8N_PORT: "5678"
      N8N_LISTEN_ADDRESS: 0.0.0.0
      # Caddy terminates TLS in front of this container, so these stay on.
      # Setting `N8N_PROTOCOL=http` behind an HTTPS proxy produces redirect
      # loops and non-secure cookies on an internet-facing admin editor.
      N8N_PROTOCOL: https
      N8N_SECURE_COOKIE: "true"
      # Load-bearing. The workflow reads its API URL and token through `$env`,
      # and n8n blocks environment access from nodes by default -- without this
      # both expressions resolve to `undefined` and every request 404s against
      # a host that is not there.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Set from first boot, which is the opposite of the advice for Modal and
      # correct here. n8n generates a key on first boot if none is given, and
      # refuses to start if an environment variable later disagrees with the
      # stored one. Providing it up front means it lives in `.env` where it can
      # be backed up, rather than being trapped in a Docker volume that is the
      # only copy.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      # Read by the workflow, not by n8n.
      #
      # The service name, not the public hostname. n8n and the API share this
      # Compose bridge, so the workflow's calls stay inside it -- no public
      # round trip, no dependency on Caddy or on DNS resolving for the pipeline
      # to work, and nothing to break when the hostname changes. The public
      # route exists for the Phase 7 frontend and for curl, not for this.
      PDM_API_BASE_URL: http://api:8000
      # Must byte-equal the API's INGEST_API_TOKEN. They are the same secret
      # under two names because two different systems read them, and a mismatch
      # is a 401 on every write.
      PDM_INGEST_TOKEN: ${INGEST_API_TOKEN:?INGEST_API_TOKEN is required}
      # Telemetry arrives at roughly one message per second per machine. Keeping
      # an execution record for every successful one grows the SQLite file
      # without ever being read; failures are kept, because a failure is the
      # thing worth looking at.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      # n8n logs a deprecation warning without this: SQLite runs without a pool
      # of read connections, which serialises every read behind the single
      # writer. The workflow reads and writes on every telemetry message, so
      # that is the hot path. Small values are fine on one core -- the point is
      # having a pool at all.
      DB_SQLITE_POOL_SIZE: "4"
      # Security, not performance. n8n's Git node can be pointed at bare
      # repositories, which is a known attack surface, and this stack uses no
      # Git node at all. Setting it removes the capability rather than relying
      # on nobody writing a workflow that uses it.
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      # `/data/.n8n/config` holds the encryption key, and n8n creates it 0644 --
      # world-readable. The warning n8n prints about this is easy to ignore
      # precisely because it says it is being ignored for now. This makes it
      # enforce 0600 instead.
      #
      # Safe here because the `n8n-permissions` service has already given the
      # volume to uid 1000, so n8n owns the file and can chmod it.
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: UTC
      TZ: UTC
    ports:
      # Loopback only, for the shared Caddy on the host network. 8101 rather
      # than 5678 so the port number says which project it belongs to when
      # something is listing listeners.
      - "127.0.0.1:8101:5678"
    volumes:
      # n8n's SQLite database and its encrypted credentials. A named volume
      # rather than a bind mount: it is the one piece of state here that is not
      # reproducible from the repository, and it has to survive a rebuild.
      - n8n-data:/data
    healthcheck:
      # Alpine, so BusyBox `wget` is available and no extra package is needed.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  n8n-data:
