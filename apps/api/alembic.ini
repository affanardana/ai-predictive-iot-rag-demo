# Alembic configuration.
#
# The database URL is deliberately NOT set here. It is read from application
# settings in `migrations/env.py`, so credentials live in `.env` and never in a
# configuration file that gets committed.

[alembic]
# `%(here)s` is the directory containing this file, so these paths resolve the
# same whether alembic is invoked from the repository root or from apps/api.
# A bare relative path would resolve against the working directory instead.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
version_path_separator = os
# Compare column types when autogenerating, so a changed type is reported
# rather than silently ignored.
compare_type = true
compare_server_default = true

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
