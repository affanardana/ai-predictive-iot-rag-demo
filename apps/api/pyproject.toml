[project]
name = "api"
version = "0.2.0"
description = "FastAPI backend for the AI Predictive Maintenance platform"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # A runtime dependency, not a test one. `HttpPredictor` and the composition
    # root both import it, so an install of `api` without the workspace's dev
    # group fails at `build_container` with `ModuleNotFoundError`. It went
    # unnoticed because CI installs every group; it surfaced when the API was
    # packaged for deployment and nothing else was there.
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
